# Behind Cloudflare Tunnel the original scheme arrives as X-Forwarded-Proto (https); keep it, else use $scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Real client IP: Cloudflare sends CF-Connecting-IP; local requests use the socket address
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    # Docker DNS: re-resolve "web" so container recreation doesn't cause 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream http://web:8000;

    client_max_body_size 20M;  # bank statement uploads

    location /static/ {
        alias /vol/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /vol/media/;
    }

    location / {
        proxy_pass $django_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }
}
