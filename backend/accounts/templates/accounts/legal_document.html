<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ doc.title }} · {{ doc.app.name }}</title>
<style>
  :root { --bg: #F6F7F9; --card: #FFFFFF; --text: #0F172A; --muted: #475569; --line: #E2E8F0; --accent: #0F766E; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0E1116; --card: #171B22; --text: #E6EAF0; --muted: #9AA4B2; --line: #2A313C; --accent: #2DD4BF; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { margin-bottom: 20px; }
  .app { color: var(--accent); font-weight: 600; font-size: 14px; letter-spacing: .3px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 6px 0 8px; }
  .meta { color: var(--muted); font-size: 14px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 24px 24px; }
  article h2 { font-size: 19px; margin: 28px 0 8px; }
  article h3 { font-size: 16px; margin: 20px 0 6px; }
  article a { color: var(--accent); }
  article table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
  ul, ol { padding-left: 22px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="app">{{ doc.app.name }}</div>
    <h1>{{ doc.title }}</h1>
    <div class="meta">Sürüm {{ doc.version }} · Yürürlük tarihi {{ doc.published_at|date:"d.m.Y" }}</div>
  </header>
  <article>{{ body|safe }}</article>
</main>
</body>
</html>
