[project]
name = "saving"
version = "0.1.0"
description = "Saving - personal finance client for app_manager backend"
requires-python = ">=3.12"
dependencies = [
    "flet==1.1.2",
    "flet-secure-storage==1.1.2",
    "httpx==0.28.1",
]

[tool.flet]
org = "com.anilcelik"
product = "Saving"
company = "anilcelik"

[tool.flet.android.manifest_application]
# the API is plain HTTP on the local network for now; remove once the server has HTTPS
usesCleartextTraffic = true
