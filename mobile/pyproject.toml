[project]
name = "saving"
version = "0.1.0"
description = "Bütçe Defteri (Saving) - personal finance client for app_manager backend"
requires-python = ">=3.12"
dependencies = [
    "flet==1.1.2",
    "flet-secure-storage==1.1.2",
    "httpx==0.28.1",
]

[tool.flet]
org = "tr.com.appmanager"
# Google Play package name: permanent once the app is published
bundle_id = "tr.com.appmanager.saving"
product = "Bütçe Defteri"
company = "appmanager"

[tool.flet.app]
# development-only server override must never ship (built apps use config.PRODUCTION_URL over HTTPS)
exclude = ["local_config.py", "local_config.example.py"]
